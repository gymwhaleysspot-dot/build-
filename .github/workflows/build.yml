name: build-a17u
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.3 nodejs
      - name: Restore A17U source
        run: cat parts/gz00 parts/gz01 parts/gz02 | base64 -d | gzip -d > a17u.lua
      - run: luac5.3 -p a17u.lua
      - run: luac5.3 -s -o a17u_raw.luac a17u.lua
      - run: node normalize_luac53_mt12.js a17u_raw.luac a17u.luac
      - run: wc -c a17u.lua a17u_raw.luac a17u.luac && sha256sum a17u.lua a17u.luac
      - uses: actions/upload-artifact@v4
        with:
          name: a17u
          path: |
            a17u.lua
            a17u_raw.luac
            a17u.luac
